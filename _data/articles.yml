# Materials that mention me, interviews, and articles — the site-wide
# "Featured In" page at /press and its RSS feed.
#
# The quickest way to add one is `mysite press <url>`: it reads the page and
# offers a title, date and language for you to confirm or correct, then asks
# whether the entry goes here, on a game's subsite, or both. Editing this file
# by hand does exactly the same thing.
#
# This list and the per-game lists in game-sites/<game>/site.yml are kept
# separate on purpose: a link may belong to one, the other, or both.
#
# Each entry:
#   date:  publication date (YYYY-MM-DD)
#   lang:  a language code from _data/languages.yml ("uk", "en", ...)
#   title: title shown as a link
#   url:   link to the material
#
# Order does not matter — the page sorts by date, newest first.

